<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enrollments - EduStack</title>
  <link href="../../assets/css/output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-nunito transition-colors duration-300">
  <!-- Nav -->
  <div id="nav-placeholder"></div>

  <!-- Main Content -->
  <main class="min-h-screen pt-12">
    <section class="px-6 max-w-6xl mx-auto flex flex-col items-end mb-10">
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/20 text-brand flex items-center justify-center mb-3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <h1 class="text-3xl font-extrabold text-[#112a46] dark:text-white mb-1">My Enrollments</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Verified enrollment ledger</p>
      </div>
    </section>

    <section class="px-6 max-w-6xl mx-auto">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7 pb-20">
        <!-- JS will populate with subjects, rendering the Enrollments layout -->
      </div>
    </section>
  </main>

  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/theme-toggle.js"></script>
  <script src="../../assets/js/partials.js"></script>
  <script src="../../assets/js/subjects.js"></script>
</body>
</html>
