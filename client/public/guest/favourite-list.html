<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Favourites - EduStack</title>
  <link href="../../assets/css/output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-nunito transition-colors duration-300">
  <!-- Nav -->
  <div id="nav-placeholder"></div>

  <!-- Main Content -->
  <main class="min-h-screen pt-12">
    <section class="px-6 max-w-6xl mx-auto">
      <h2 class="text-center md:text-left text-2xl md:text-3xl font-extrabold text-brand mb-10">Here are your favourite subjects:</h2>
      
      <div id="favGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7 pb-20">
        <!-- JS will populate -->
      </div>
    </section>
  </main>

  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/theme-toggle.js"></script>
  <script src="../../assets/js/partials.js"></script>
  <script src="../../assets/js/subjects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Small delay to let subjects.js initialize its favourites set
      setTimeout(() => {
        if(window.renderFavourites) window.renderFavourites();
      }, 50);
    });
  </script>
</body>
</html>
