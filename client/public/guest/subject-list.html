<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subject List - EduStack</title>
  <link href="../../assets/css/output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-nunito transition-colors duration-300">
  <!-- Nav -->
  <div id="nav-placeholder"></div>

  <!-- Main Content -->
  <main class="min-h-screen pt-12">
    <section class="px-6 max-w-6xl mx-auto">
      <h2 class="text-center text-3xl font-extrabold text-brand mb-2">Explore Subjects</h2>
      <p id="countLabel" class="text-center text-sm text-gray-400 dark:text-gray-500 mb-8">Showing all subjects</p>
      
      <div class="flex flex-col sm:flex-row sm:items-center gap-4 mb-8">
        <div class="relative flex-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchInput" type="text" placeholder="Search subjects..." class="w-full pl-11 pr-4 py-3 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#222222] text-[15px] font-semibold focus:outline-none focus:ring-2 focus:ring-brand/40 shadow-sm">
        </div>
      </div>
      
      <!-- Branch Logos Selector Bar -->
      <div class="mb-6">
        <p class="text-xs font-black uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3 text-center sm:text-left">Select Engineering Branch</p>
        <div id="branchRow" class="grid grid-cols-2 sm:grid-cols-6 gap-3">
          <button data-branch="All" class="branch-pill flex items-center justify-center gap-2.5 p-3 rounded-2xl border border-brand bg-brand text-white font-extrabold text-xs shadow-md cursor-pointer transition-all">
            <i class="fa-solid fa-layer-group text-sm"></i>
            <span>All Branches</span>
          </button>
          
          <button data-branch="CSE" class="branch-pill flex items-center justify-center gap-2.5 p-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#222222] hover:border-indigo-500 text-gray-800 dark:text-gray-200 font-extrabold text-xs cursor-pointer transition-all">
            <div class="w-6 h-6 rounded-lg bg-indigo-500/10 text-indigo-500 flex items-center justify-center">
              <i class="fa-solid fa-laptop-code text-xs"></i>
            </div>
            <span>CSE</span>
          </button>

          <button data-branch="ECE" class="branch-pill flex items-center justify-center gap-2.5 p-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#222222] hover:border-cyan-500 text-gray-800 dark:text-gray-200 font-extrabold text-xs cursor-pointer transition-all">
            <div class="w-6 h-6 rounded-lg bg-cyan-500/10 text-cyan-500 flex items-center justify-center">
              <i class="fa-solid fa-microchip text-xs"></i>
            </div>
            <span>ECE</span>
          </button>

          <button data-branch="EEE" class="branch-pill flex items-center justify-center gap-2.5 p-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#222222] hover:border-amber-500 text-gray-800 dark:text-gray-200 font-extrabold text-xs cursor-pointer transition-all">
            <div class="w-6 h-6 rounded-lg bg-amber-500/10 text-amber-500 flex items-center justify-center">
              <i class="fa-solid fa-bolt text-xs"></i>
            </div>
            <span>EEE / EE</span>
          </button>

          <button data-branch="MECH" class="branch-pill flex items-center justify-center gap-2.5 p-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#222222] hover:border-rose-500 text-gray-800 dark:text-gray-200 font-extrabold text-xs cursor-pointer transition-all">
            <div class="w-6 h-6 rounded-lg bg-rose-500/10 text-rose-500 flex items-center justify-center">
              <i class="fa-solid fa-gear text-xs"></i>
            </div>
            <span>ME</span>
          </button>

          <button data-branch="CIVIL" class="branch-pill flex items-center justify-center gap-2.5 p-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#222222] hover:border-emerald-500 text-gray-800 dark:text-gray-200 font-extrabold text-xs cursor-pointer transition-all">
            <div class="w-6 h-6 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
              <i class="fa-solid fa-building text-xs"></i>
            </div>
            <span>CE</span>
          </button>
        </div>
      </div>

      <p class="text-xs font-black uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-2">Filter by Semester</p>
      <div id="pillRow" class="flex gap-2 overflow-x-auto pb-2 mb-10 -mx-1 px-1 no-scrollbar">
        <button data-sem="0" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-brand text-white border-0 cursor-pointer shadow-md">All Semesters</button>
        <button data-sem="1" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 1</button>
        <button data-sem="2" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 2</button>
        <button data-sem="3" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 3</button>
        <button data-sem="4" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 4</button>
        <button data-sem="5" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 5</button>
        <button data-sem="6" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 6</button>
        <button data-sem="7" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 7</button>
        <button data-sem="8" class="pill shrink-0 px-5 py-2.5 rounded-full text-sm font-black tracking-wide bg-gray-100 dark:bg-[#2e2e2e] text-gray-600 dark:text-gray-400 border-0 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Sem 8</button>
      </div>

      <p id="emptyState" class="hidden text-center text-gray-400 dark:text-gray-500 py-16 font-bold">No subjects match your search.</p>
      
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7 pb-20">
        <!-- JS will populate -->
      </div>
    </section>
  </main>

  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/theme-toggle.js"></script>
  <script src="../../assets/js/partials.js"></script>
  <script src="../../assets/js/subjects.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</body>
</html>
