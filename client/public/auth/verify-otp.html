<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduStack — Verify OTP</title>
  <script src="/assets/js/partials.js" defer></script>
  <link rel="stylesheet" href="/assets/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#181818] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">
  <div id="nav-placeholder"></div>
  
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-0">
    <div class="w-full max-w-md bg-white dark:bg-[#222222] p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 text-center relative overflow-hidden">
      
      <div class="w-16 h-16 rounded-full bg-brand/10 text-brand flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        <i class="fa-solid fa-envelope-circle-check"></i>
      </div>

      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Verify Your Email</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 mb-6">
        Enter the 6-digit verification code sent to <br>
        <strong id="target-email" class="text-gray-800 dark:text-gray-200">your email address</strong>
      </p>

      <div id="error-box" class="hidden bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 p-3.5 rounded-xl mb-5 text-sm font-medium"></div>
      <div id="success-box" class="hidden bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900/50 text-emerald-600 dark:text-emerald-400 p-3.5 rounded-xl mb-5 text-sm font-medium"></div>

      <form id="otp-form" class="space-y-6">
        <div>
          <input 
            id="otp-input"
            type="text" 
            maxlength="6" 
            required 
            placeholder="000000"
            class="w-full text-center text-3xl font-extrabold tracking-[0.5em] py-3.5 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          >
        </div>

        <button 
          type="submit" 
          class="w-full bg-brand hover:bg-brand-deep text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all active:scale-[0.98] border-0 cursor-pointer text-sm"
        >
          Verify & Continue
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-gray-100 dark:border-gray-800 text-sm text-gray-500 dark:text-gray-400 flex items-center justify-between">
        <span>Didn't receive the code?</span>
        <button 
          id="resend-btn" 
          type="button" 
          class="text-brand hover:underline font-bold border-0 bg-transparent cursor-pointer p-0 text-sm"
        >
          Resend OTP
        </button>
      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-gray-400 dark:text-gray-500 mt-auto border-t border-transparent dark:border-gray-800/40">
    Built with <span class="text-brand">♥</span> by a CSE student, for CSE students — EduStack
  </footer>

  <script src="/assets/js/theme-toggle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || '';
      
      const emailDisplay = document.getElementById('target-email');
      const otpInput     = document.getElementById('otp-input');
      const otpForm      = document.getElementById('otp-form');
      const resendBtn    = document.getElementById('resend-btn');
      const errorBox     = document.getElementById('error-box');
      const successBox   = document.getElementById('success-box');

      if (email) {
        emailDisplay.textContent = email;
      } else {
        emailDisplay.textContent = 'your registered email';
      }

      otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        successBox.classList.add('hidden');

        const otp = otpInput.value.trim();
        if (otp.length !== 6) {
          errorBox.textContent = '❌ Please enter the full 6-digit OTP.';
          errorBox.classList.remove('hidden');
          return;
        }

        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            successBox.textContent = '🎉 Email verified successfully! Redirecting to login...';
            successBox.classList.remove('hidden');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1500);
          } else {
            errorBox.textContent = `❌ ${data.message || (data.errors && data.errors[0]?.message) || 'Invalid OTP code.'}`;
            errorBox.classList.remove('hidden');
          }
        } catch (err) {
          errorBox.textContent = '❌ Server error. Please try again.';
          errorBox.classList.remove('hidden');
        }
      });

      resendBtn.addEventListener('click', async () => {
        if (!email) {
          alert('Email parameter missing. Please go back to login or registration.');
          return;
        }
        try {
          resendBtn.disabled = true;
          resendBtn.textContent = 'Sending...';

          const res = await fetch('/api/auth/resend-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            alert('📩 A new OTP code has been sent to your email address!');
          } else {
            alert(`❌ ${data.message || 'Failed to resend OTP.'}`);
          }
        } catch (err) {
          alert('❌ Connection error while resending OTP.');
        } finally {
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend OTP';
        }
      });
    });
  </script>
</body>
</html>
