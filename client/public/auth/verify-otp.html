<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/partials.js"></script>
  <link rel="stylesheet" href="../../assets/css/output.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#181818] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">
  <div id="nav-placeholder"></div>
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-0">
    <div class="w-full max-w-md bg-white dark:bg-[#222222] p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 text-center">
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Verify OTP</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-2 mb-6">Enter the 6-digit code sent to your email.</p>
      <form class="space-y-5">
        <input type="text" maxlength="6" class="w-full text-center text-2xl tracking-[1em] py-3 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all">
        <button type="submit" class="w-full bg-brand hover:bg-brand-deep text-white font-semibold py-3 px-4 rounded-xl border-0 cursor-pointer">Verify Code</button>
      </form>
    </div>
  </main>
  <script src="/assets/js/theme-toggle.js"></script>
</body>
</html>
