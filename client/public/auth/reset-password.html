<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/partials.js"></script>
  <link rel="stylesheet" href="../../assets/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#181818] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">
  <div id="nav-placeholder"></div>
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-0">
    <div class="absolute w-[420px] h-[420px] -top-40 -left-32 rounded-full bg-brand opacity-10 blur-3xl z-[-1]"></div>
    <div class="absolute w-[380px] h-[380px] -bottom-40 -right-24 rounded-full bg-brand-deep opacity-10 blur-3xl z-[-1]"></div>
    <div class="w-full max-w-md bg-white dark:bg-[#222222] p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 transition-colors duration-300 relative z-10">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand/10 text-brand mb-3">
          <i class="fa-solid fa-lock-open text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Reset Password</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Enter a new secure password</p>
      </div>

      <div id="alert-box" class="hidden p-4 rounded-xl mb-4 text-xs font-medium"></div>

      <form id="reset-password-form" class="space-y-5 m-0 p-0">
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">New Password <span class="text-brand font-bold">*</span></label>
          <div class="relative flex items-center">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 dark:text-gray-500"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="new-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Confirm New Password <span class="text-brand font-bold">*</span></label>
          <div class="relative flex items-center">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 dark:text-gray-500"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="confirm-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all text-sm" />
          </div>
        </div>

        <button type="submit" class="w-full bg-brand hover:bg-brand-deep text-white font-semibold py-2.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98] mt-2 tracking-wide text-sm cursor-pointer border-0">
          Reset Password
        </button>
      </form>
    </div>
  </main>
  <script src="/assets/js/theme-toggle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const email = sessionStorage.getItem('resetEmail');
      const otp   = sessionStorage.getItem('resetOtp');
      const form  = document.getElementById('reset-password-form');
      const alertBox = document.getElementById('alert-box');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('new-password').value.trim();
        const confirmPassword = document.getElementById('confirm-password').value.trim();

        if (password !== confirmPassword) {
          alertBox.textContent = '❌ Passwords do not match.';
          alertBox.className = 'bg-red-50 text-red-600 dark:bg-red-950/30 border border-red-200 p-4 rounded-xl mb-4 text-xs font-medium block';
          return;
        }

        if (!email) {
          alert('Session expired. Please start forgot password flow again.');
          window.location.href = '/auth/forgot-password.html';
          return;
        }

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, password, confirmPassword })
          });
          const resData = await res.json();

          if (res.ok && resData.success) {
            alertBox.textContent = '🎉 ' + (resData.message || 'Password reset successfully! Redirecting to login...');
            alertBox.className = 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/30 border border-emerald-200 p-4 rounded-xl mb-4 text-xs font-medium block';
            sessionStorage.removeItem('resetEmail');
            sessionStorage.removeItem('resetOtp');
            setTimeout(() => {
              window.location.href = '/auth/login.html';
            }, 1200);
          } else {
            alertBox.textContent = '❌ ' + (resData.message || 'Failed to reset password.');
            alertBox.className = 'bg-red-50 text-red-600 dark:bg-red-950/30 border border-red-200 p-4 rounded-xl mb-4 text-xs font-medium block';
          }
        } catch (err) {
          alertBox.textContent = '❌ Server connection error while resetting password.';
          alertBox.className = 'bg-red-50 text-red-600 p-4 rounded-xl mb-4 text-xs font-medium block';
        }
      });
    });
  </script>
</body>
</html>
