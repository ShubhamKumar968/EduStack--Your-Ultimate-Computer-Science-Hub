<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/partials.js"></script>
  <link rel="stylesheet" href="../../assets/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#181818] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">
  <div id="nav-placeholder"></div>
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-0">
    <div class="absolute w-[420px] h-[420px] -top-40 -left-32 rounded-full bg-brand opacity-10 blur-3xl z-[-1]"></div>
    <div class="absolute w-[380px] h-[380px] -bottom-40 -right-24 rounded-full bg-brand-deep opacity-10 blur-3xl z-[-1]"></div>
    <div class="w-full max-w-md bg-white dark:bg-[#222222] p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 transition-colors duration-300 relative z-10">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand/10 text-brand mb-3">
          <i class="fa-solid fa-key text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Forgot Password</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Enter your email to receive a reset link</p>
      </div>
      <form id="forgot-password-form" class="space-y-5 m-0 p-0">
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">
            Email Address <span class="text-brand font-bold">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 dark:text-gray-500">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="email" name="email" required placeholder="name@example.com" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300 text-sm" />
          </div>
        </div>
        <button type="submit" class="w-full bg-brand hover:bg-brand-deep text-white font-semibold py-2.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98] mt-2 tracking-wide text-sm cursor-pointer flex items-center justify-center gap-2 border-0">
          <span>Send Reset Link</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
      <div class="text-center mt-6 pt-5 border-t border-gray-100 dark:border-gray-800 transition-colors duration-300">
        <a href="/auth/login.html" class="text-sm font-semibold text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition no-underline">◀ BACK TO LOGIN</a>
      </div>
    </div>
  </main>
  <footer class="py-4 text-center text-xs text-gray-400 dark:text-gray-500 mt-auto border-t border-transparent dark:border-gray-800/40">
    Built with <span class="text-brand">♥</span> by a CSE student, for CSE students — EduStack
  </footer>
  <script src="/assets/js/theme-toggle.js"></script>
</body>
</html>
