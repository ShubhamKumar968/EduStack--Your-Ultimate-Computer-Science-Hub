<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../assets/js/partials.js"></script>
  <link rel="stylesheet" href="../../assets/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#181818] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">
  <div id="nav-placeholder"></div>
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-0">
    <div class="absolute w-[420px] h-[420px] -top-40 -left-32 rounded-full bg-brand opacity-10 blur-3xl z-[-1]"></div>
    <div class="absolute w-[380px] h-[380px] -bottom-40 -right-24 rounded-full bg-brand-deep opacity-10 blur-3xl z-[-1]"></div>
    <div class="w-full max-w-md bg-white dark:bg-[#222222] p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 transition-colors duration-300 relative z-10">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand/10 text-brand mb-3">
          <i class="fa-solid fa-user-shield text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Welcome Back</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Please enter your credentials to login</p>
      </div>
      <div id="error-message" class="hidden bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 p-3.5 rounded-xl mb-5 text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-base"></i>
        <span>Invalid credentials</span>
      </div>
      <form id="login-form" class="space-y-5 m-0 p-0">
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">
            Email Address <span class="text-brand font-bold">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 dark:text-gray-500">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="email" name="email" required placeholder="name@example.com" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300 text-sm" />
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">
              Password <span class="text-brand font-bold">*</span>
            </label>
            <a href="forgot-password.html" class="text-xs text-brand hover:text-brand-deep font-medium transition-colors no-underline">Forgot password?</a>
          </div>
          <div class="relative flex items-center">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 dark:text-gray-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input id="password-input" type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#181818] rounded-xl text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300 text-sm" />
            <button id="password-toggle-btn" type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 focus:outline-none cursor-pointer border-0 bg-transparent" aria-label="Toggle password visibility">
              <i id="eye-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center">
          <input id="remember_me" name="remember_me" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-brand focus:ring-brand dark:bg-[#181818] dark:border-gray-700 cursor-pointer">
          <label for="remember_me" class="ml-2 block text-sm text-gray-600 dark:text-gray-400 cursor-pointer select-none">
            Remember my session
          </label>
        </div>
        <button type="submit" class="w-full bg-brand hover:bg-brand-deep text-white font-semibold py-2.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98] mt-2 tracking-wide text-sm cursor-pointer flex items-center justify-center gap-2 border-0">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
      <div class="relative flex py-4 items-center mt-4">
        <div class="flex-grow border-t border-gray-200 dark:border-gray-800"></div>
        <span class="flex-shrink mx-4 text-gray-400 dark:text-gray-500 text-xs font-bold uppercase tracking-wider">Or</span>
        <div class="flex-grow border-t border-gray-200 dark:border-gray-800"></div>
      </div>
      <a href="/api/auth/google" class="w-full inline-flex items-center justify-center gap-2.5 bg-white dark:bg-[#181818] border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-[#2e2e2e] text-gray-700 dark:text-gray-200 font-bold py-2.5 px-4 rounded-xl shadow-sm transition-all text-sm no-underline active:scale-[0.98]">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </a>
      <div class="text-center mt-6 pt-5 border-t border-gray-100 dark:border-gray-800 transition-colors duration-300">
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Don't have an account? 
          <a href="register.html" class="text-brand hover:text-brand-deep font-semibold transition-colors no-underline">Sign up now</a>
        </p>
      </div>
    </div>
  </main>
  <footer class="py-4 text-center text-xs text-gray-400 dark:text-gray-500 mt-auto border-t border-transparent dark:border-gray-800/40">
    Built with <span class="text-brand">♥</span> by a CSE student, for CSE students — EduStack
  </footer>
  <script src="../../assets/js/theme-toggle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('password-input');
      const toggleBtn = document.getElementById('password-toggle-btn');
      const eyeIcon = document.getElementById('eye-icon');
      toggleBtn?.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
      });
      const errorBox = document.getElementById('error-message');
      const errorText = errorBox?.querySelector('span');

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (errorBox) errorBox.classList.add('hidden');

        const emailInput = e.target.querySelector('[name="email"]');
        const passwordVal = passwordInput ? passwordInput.value : '';

        const payload = {
          email: emailInput ? emailInput.value.trim() : '',
          password: passwordVal
        };

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const resData = await res.json();

          if (res.ok && resData.success) {
            window.location.href = '/';
          } else {
            const firstErr = resData.errors && resData.errors.length > 0 
              ? resData.errors[0].message || resData.errors[0].msg
              : resData.message;

            // If account is unverified, redirect directly to verify OTP page
            if (firstErr && (firstErr.includes('not verified') || firstErr.includes('OTP'))) {
              alert('Account unverified. Redirecting to OTP verification page...');
              window.location.href = `verify-otp.html?email=${encodeURIComponent(payload.email)}`;
              return;
            }

            if (errorText) errorText.textContent = firstErr || 'Invalid email or password.';
            if (errorBox) errorBox.classList.remove('hidden');
          }
        } catch (err) {
          if (errorText) errorText.textContent = 'Server connection error. Please try again.';
          if (errorBox) errorBox.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
