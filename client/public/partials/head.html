<title>EduStack</title>
<!-- Tailwind CDN for static files without build step -->
<link rel="stylesheet" href="../../assets/css/output.css">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @media (prefers-reduced-motion: reduce){ .animate-float{animation:none;} }
  .pill-scroll::-webkit-scrollbar{height:0px;}
  .chev{transition:transform .25s ease;}
  .rotate-open{transform:rotate(180deg);}
  /* Logo containers — no background, just the image */
  .logo-box {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: transparent;
    margin-bottom: 1rem;
    flex-shrink: 0;
  }
  .logo-box img {
    width: 40px; height: 40px;
    object-fit: contain;
  }
  /* Small logo for coding platform list */
  .logo-box-sm {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: transparent;
    flex-shrink: 0;
  }
  .logo-box-sm img {
    width: 26px; height: 26px;
    object-fit: contain;
  }
  /* Fallback text inside logo box */
  .logo-fallback {
    font-weight: 800;
    font-size: 13px;
    color: #555;
  }
</style>
