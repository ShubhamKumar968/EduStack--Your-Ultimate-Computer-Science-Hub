<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../assets/js/partials.js"></script>
  <link rel="stylesheet" href="../../assets/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#181818] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">
  <div id="nav-placeholder"></div>
  
  <main class="container mx-auto mt-8 p-8 bg-white dark:bg-[#222222] rounded-3xl shadow-md border border-gray-100 dark:border-gray-800 transition-colors duration-300 my-auto w-full max-w-lg relative z-10">
    <div class="absolute w-[420px] h-[420px] -top-40 -left-32 rounded-full bg-brand opacity-10 blur-3xl z-[-1] pointer-events-none"></div>
    <div class="absolute w-[380px] h-[380px] -bottom-40 -right-24 rounded-full bg-brand-deep opacity-10 blur-3xl z-[-1] pointer-events-none"></div>
    
    <div class="text-center mb-6">
      <h1 class="text-3xl font-black text-gray-800 dark:text-gray-100 tracking-tight">
        Add New Subject
      </h1>
    </div>

    <form action="/admin/add-subject" method="POST" enctype="multipart/form-data" class="mx-auto space-y-5" id="subject-listing-form">

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">Subject Name</label>
        <input
          type="text"
          name="subjectName"
          placeholder="Enter Subject Name"
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
          required
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">Semester (e.g. 4)</label>
        <input
          type="number"
          name="semester"
          placeholder="Semester Number"
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
          required
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">Branch (e.g. CSE)</label>
        <input
          type="text"
          name="branch"
          placeholder="Enter Branch (e.g. CSE, IT, ECE, MECH)"
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
          required
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">Rating (e.g. 4.5)</label>
        <input
          type="text"
          name="rating"
          placeholder="Rating"
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
          required
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">Notes Drive Link</label>
        <input
          type="url"
          name="notesLink"
          placeholder="https://drive.google.com/..."
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">YouTube Playlist URL</label>
        <input
          type="url"
          name="youtubeLink"
          placeholder="https://youtube.com/playlist..."
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">PYQ Drive Link</label>
        <input
          type="url"
          name="pyqLink"
          placeholder="https://drive.google.com/..."
          class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 shadow-sm"
        />
      </div>
      
      <div class="bg-gray-50/50 dark:bg-[#181818]/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-800">
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2.5 pl-1">Subject Image Asset</label>
        
        <div id="property-dropzone" class="border-2 border-dashed border-gray-300 dark:border-gray-700 hover:border-brand dark:hover:border-brand rounded-xl p-5 text-center cursor-pointer bg-white dark:bg-[#222222] transition-all select-none group relative">
          <input 
            type="file" 
            id="property-file-input" 
            name="photo" 
            accept="image/png, image/jpeg, image/jpg, image/webp" 
            class="hidden"
            required
          >
          <div class="w-10 h-10 mx-auto bg-brand/10 text-brand rounded-full flex items-center justify-center transform transition group-hover:scale-110 mb-2 shadow-sm">
            <i class="fa-solid fa-cloud-arrow-up text-md"></i>
          </div>
          <p class="text-xs font-semibold text-gray-600 dark:text-gray-300">Drag subject image here or <span class="text-brand font-bold underline">Browse</span></p>
          <p class="text-[10px] text-gray-400 mt-0.5">PNG, JPG, JPEG or WEBP (Max 5MB)</p>
        </div>

        <div id="property-progress-box" class="hidden mt-3 bg-white dark:bg-[#222222] border border-gray-100 dark:border-gray-800 rounded-xl p-3 animate-fade-in">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand rounded-lg flex flex-col items-center justify-center text-white font-black text-[8px] tracking-tighter uppercase flex-shrink-0 shadow-sm">
              <i class="fa-solid fa-file-image text-xs mb-0.5"></i>
              <span id="property-ext-badge">IMG</span>
            </div>
            <div class="flex-grow min-w-0">
              <div class="flex justify-between items-center mb-1">
                <h5 id="property-filename" class="text-xs font-bold text-gray-700 dark:text-gray-300 truncate pr-2">subject.jpg</h5>
                <span id="property-percent" class="text-[9px] font-extrabold text-brand bg-brand/10 px-1.5 py-0.5 rounded">0%</span>
              </div>
              <div class="w-full h-1 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                <div id="property-bar-fill" class="h-full w-0 bg-brand transition-all duration-150 rounded-full"></div>
              </div>
              <p id="property-size-metrics" class="text-[9px] font-semibold text-gray-400 mt-1">0MB of 0MB</p>
            </div>
          </div>
        </div>
        <div id="property-drop-error" class="hidden mt-2.5 p-2 bg-brand/10 border border-brand/30 rounded-xl text-center text-xs font-bold text-brand"></div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">Description</label>
        <textarea
          name="description"
          placeholder="Describe the subject..."
          class="w-full px-4 py-2 mb-4 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand transition-colors duration-300 min-h-[100px] shadow-sm leading-relaxed"
          required
        ></textarea>
      </div>
      
      <input 
        type="submit" 
        value="Publish Subject" 
        class="w-full bg-brand text-white py-3 rounded-xl hover:bg-brand-deep transition duration-300 cursor-pointer font-bold shadow-md shadow-brand/20 active:scale-[0.98] tracking-wide text-sm border-0" 
      />
    </form>
  </main>

  <script src="../../assets/js/theme-toggle.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const dropzone = document.getElementById("property-dropzone");
      const fileInput = document.getElementById("property-file-input");
      const progressBox = document.getElementById("property-progress-box");
      const filenameLabel = document.getElementById("property-filename");
      const percentLabel = document.getElementById("property-percent");
      const barFill = document.getElementById("property-bar-fill");
      const metricsLabel = document.getElementById("property-size-metrics");
      const extBadge = document.getElementById("property-ext-badge");
      const errorBox = document.getElementById("property-drop-error");

      dropzone.addEventListener("click", () => fileInput.click());

      ["dragenter", "dragover"].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropzone.classList.add("border-brand", "bg-brand/5");
        }, false);
      });

      ["dragleave", "drop"].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropzone.classList.remove("border-brand", "bg-brand/5");
        }, false);
      });

      dropzone.addEventListener("drop", (e) => {
        const transferredFiles = e.dataTransfer.files;
        if (transferredFiles.length > 0) {
          fileInput.files = transferredFiles;
          simulateFileVerificationPipeline(transferredFiles[0]);
        }
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          simulateFileVerificationPipeline(e.target.files[0]);
        }
      });

      function simulateFileVerificationPipeline(fileObject) {
        errorBox.classList.add("hidden");
        const permittedMimeTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp'];

        if (!permittedMimeTypes.includes(fileObject.type)) {
          errorBox.textContent = "❌ Format Mismatch: Only PNG, JPG, JPEG, and WEBP assets are allowed!";
          errorBox.classList.remove("hidden");
          fileInput.value = ''; progressBox.classList.add("hidden");
          return;
        }

        if (fileObject.size > 5 * 1024 * 1024) {
          errorBox.textContent = "❌ Dimension Warning: The chosen file exceeds the maximum 5MB restriction!";
          errorBox.classList.remove("hidden");
          fileInput.value = ''; progressBox.classList.add("hidden");
          return;
        }

        progressBox.classList.remove("hidden");
        filenameLabel.textContent = fileObject.name;
        
        const extensionString = fileObject.name.split('.').pop().toUpperCase();
        extBadge.textContent = extensionString.substring(0, 3);

        const totalFileBytes = fileObject.size;
        const sizeInMB = (totalFileBytes / (1024 * 1024)).toFixed(2);

        let activeProgressProgress = 0;
        barFill.style.width = "0%";
        percentLabel.textContent = "0%";

        const liveSimulationTicker = setInterval(() => {
          activeProgressProgress += Math.floor(Math.random() * 15) + 5;
          if (activeProgressProgress >= 100) {
            activeProgressProgress = 100;
            clearInterval(liveSimulationTicker);
            percentLabel.textContent = "Uploaded 100% ✅";
          } else {
            percentLabel.textContent = `Uploading... ${activeProgressProgress}%`;
          }

          barFill.style.width = `${activeProgressProgress}%`;
          const uploadedChunksInMB = ((activeProgressProgress / 100) * sizeInMB).toFixed(2);
          metricsLabel.textContent = `${uploadedChunksInMB}MB of ${sizeInMB}MB Processed`;
        }, 80);
      }

      // Handle Subject Form Submission (AJAX REST API)
      const form = document.getElementById("subject-listing-form");
      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = new FormData();
          const subjectName = form.querySelector('[name="subjectName"]').value.trim();
          formData.append('name', subjectName);
          formData.append('code', subjectName.replace(/[^a-zA-Z0-9]/g, '').substring(0, 8).toUpperCase());
          formData.append('semester', form.querySelector('[name="semester"]').value);
          formData.append('branch', form.querySelector('[name="branch"]').value);
          formData.append('description', form.querySelector('[name="description"]').value.trim());

          const notesInput = form.querySelector('[name="notesLink"]');
          const ytInput = form.querySelector('[name="youtubeLink"]');
          const pyqInput = form.querySelector('[name="pyqLink"]');
          const ratingInput = form.querySelector('[name="rating"]');

          if (notesInput && notesInput.value) formData.append('notesLink', notesInput.value.trim());
          if (ytInput && ytInput.value) formData.append('youtubeLink', ytInput.value.trim());
          if (pyqInput && pyqInput.value) formData.append('pyqLink', pyqInput.value.trim());
          if (ratingInput && ratingInput.value) formData.append('rating', ratingInput.value.trim());

          if (fileInput.files && fileInput.files[0]) {
            formData.append('thumbnail', fileInput.files[0]);
          }

          try {
            const res = await fetch('/api/subjects', {
              method: 'POST',
              credentials: 'include',
              body: formData
            });

            const resData = await res.json();
            if (res.ok && resData.success) {
              alert('🎉 Subject created successfully!');
              window.location.href = '/admin/subject-added.html';
            } else {
              if (res.status === 403) {
                alert('⛔ Access Denied: Admin role is required to publish subjects.');
              } else {
                alert(`❌ ${resData.message || 'Failed to publish subject.'}`);
              }
            }
          } catch (err) {
            alert('❌ Network error while publishing subject.');
          }
        });
      }
    });
  </script>
</body>
</html>
